name: Security Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 06:00 UTC

env:
  NODE_VERSION: '20'
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/loja_test
  NEXTAUTH_SECRET: test-secret-for-ci-at-least-32-chars-long!!
  OS_APPROVAL_SECRET: test-os-secret-for-ci-at-least-32-chars!!
  NEXTAUTH_URL: http://localhost:3000

jobs:
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Security Check (Fail-fast)
        run: npx ts-node scripts/security-check.ts

      - name: Dependency Audit
        run: |
          npm audit --audit-level=high
        continue-on-error: false

      - name: Snyk Security Scan
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high
        continue-on-error: true

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: OWASP ZAP Dynamic Scan
        uses: zaproxy/action-full-scan@v0.12.0
        with:
          target: 'http://localhost:3000'
          cmd_options: '-a -j'
        continue-on-error: true

  regression-tests:
    name: Security Regression Tests
    runs-on: ubuntu-latest
    needs: security-scan
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: loja_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run database migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Seed database
        run: npx ts-node prisma/seed.ts
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Start application
        run: |
          npm run build
          npm run start &
          npx wait-on http://localhost:3000 --timeout 30000

      - name: Run security regression tests
        run: node scripts/security-regression-test.mjs

      - name: Run security validation checklist
        run: node scripts/validate-security.mjs

      - name: Stop application
        run: kill $(lsof -t -i:3000) || true

  dependency-monitor:
    name: Dependency Monitoring
    runs-on: ubuntu-latest
    needs: regression-tests
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Snyk Monitor
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --all-projects
          command: monitor

  notify:
    name: Security Notification
    runs-on: ubuntu-latest
    needs: [security-scan, regression-tests]
    if: failure()
    steps:
      - name: Notify security failure
        run: |
          echo "::warning::Security pipeline failed. Check the logs for details."
          echo "Security regression: ${{ needs.regression-tests.result }}"
          echo "Security scan: ${{ needs.security-scan.result }}"
