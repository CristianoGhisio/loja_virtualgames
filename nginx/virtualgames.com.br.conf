# ── HTTP → HTTPS (www e non-www) ──
server {
    listen 80;
    listen [::]:80;
    server_name virtualgames.com.br www.virtualgames.com.br;
    return 301 https://virtualgames.com.br$request_uri;
}

# ── WWW → NON-WWW (HTTPS) ──
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.virtualgames.com.br;

    ssl_certificate /etc/letsencrypt/live/virtualgames.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/virtualgames.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    server_tokens off;

    return 301 https://virtualgames.com.br$request_uri;
}

# ── SITE PRINCIPAL (non-www, HTTPS) ──
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name virtualgames.com.br;

    ssl_certificate /etc/letsencrypt/live/virtualgames.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/virtualgames.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    server_tokens off;

    charset utf-8;
    client_max_body_size 50M;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Bloquear rotas do sistema interno
    location /dashboard/ { return 404; }
    location = /dashboard { return 404; }
    location /login { return 404; }
    location = /login { return 404; }
    location /auth/ { return 404; }
    location = /auth { return 404; }

    location /api/public/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/integrations/whatsapp/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/health {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    location /api/ {
        return 404;
    }
    location = /api {
        return 404;
    }

    location /health {
        return 200 "OK";
        add_header Content-Type text/plain;
        access_log off;
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache virtualgames_landing;
        proxy_cache_key "$scheme$host$request_uri";
        proxy_cache_valid 200 30d;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header Cache-Control "public, immutable, max-age=2592000";
        add_header X-Cache-Status $upstream_cache_status;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_cache_bypass $http_upgrade;

        proxy_cache virtualgames_landing;
        proxy_cache_key "$scheme$host$request_uri";
        proxy_cache_valid 200 302 24h;
        proxy_cache_valid 301 1h;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        proxy_cache_revalidate on;
        proxy_cache_min_uses 1;
        proxy_ignore_headers Set-Cookie Cache-Control;
        proxy_hide_header Set-Cookie;
        add_header X-Cache-Status $upstream_cache_status;
    }
}
